        text: "Linked QA ticket NP-9371 ({SR_26} FILTERING&SEARCHING FIXES_2, item F2_03) — exact match: selecting a search result opens the object instead of selecting it; biggest impact when adding a connector to a conversation/blueprint. Root cause found in code: SelectExistingDatasourceModal inherits DataSourceList's default ConnectorSearch, whose onSelect calls useNavigateToConnector (ConnectorSearch.tsx:23-42) — navigates to /datasource/:id instead of adding to selection. Introduced by PR #1075 (NP-6901 unified entity filters), survived the #1286 regression sweep (merged [skip-e2e])."
      - at: 2026-07-08T14:21:30.394Z
        kind: session
        text: |-
          Done researching. Summary:

          ## mb-13 — findings

          **Root cause (confirmed in code).** `SelectExistingDatasourceModal` (Add-connector modal) embeds `DataSourceList` without `showAdvancedFilter={false}` and without custom `filterBar.customSearch`. So it inherits default search widget `ConnectorSearch`, whose `onSelect` calls `useNavigateToConnector` → `navigate('/datasource/${id}')` (`apps/frontend/src/components/datasource-list/ConnectorSearch.tsx:23-42`). Search result click navigates away; plain list click goes through `onSelectionChange` and adds correctly (`DataSourceList.tsx:167-205`). Behavior came in with PR #1075 (NP-6901 unified entity filters); survived regression-sweep PR #1286, which merged `[skip-e2e]`.

          **QA ticket found + linked.** [NP-9371](https://newtonresearch.atlassian.net/browse/NP-9371) "{SR_26} FILTERING&SEARCHING FIXES_2", item **F2_03** — verbatim same bug ("selecting any object immediately opens it… biggest impact when adding a connector, breaks conversation and blueprint creation flows"). Card mb-13 now has `--ticket NP-9371` set plus research comment. Adjacent: NP-9396 (blueprint-input connector search incomplete results) is a sibling symptom in the same rework.

          **Slack thread: blocked.** Slack MCP token lacks `channels:history` scope (`missing_scope` error) — can't read thread C07TPN9622U/p1783455545321229 or recent channel discussion. Reauthorize token with history scopes if thread context needed; card comment + Loom/Jam links + NP-9371 already cover the substance.

