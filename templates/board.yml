# mini-board configuration — this file drives the board.
# State (the cards) lives next door in state.yml; this file is yours to edit.

board:
  name: My Work
  # Swimlanes: group cards into horizontal lanes by a field.
  # "type" (pr / ticket / slack / task), "project", or "none".
  group_by: type

defaults:
  # Lets PR refs be bare numbers ("--pr 1234") instead of full URLs.
  repo: your-org/your-repo
  # Prefix for non-URL ticket refs, used by `mb open <card> ticket`.
  ticket_url: https://your-org.atlassian.net/browse/
  # Default project for new cards (optional).
  # project: main

# The lifecycle, left to right. Column knobs:
#   attention: true      -> every card here is always called out (triage columns)
#   stale_after: 4h      -> call out cards with no activity for this long (m/h/d/w)
#   on_enter / on_leave  -> shell commands fired when a card moves in/out.
#     Templates use {{card.id}} {{card.title}} {{card.pr}} {{card.ticket}}
#     {{card.slack}} {{card.session}} {{card.context}} {{prompt}} {{message}}
#     {{from}} {{to}}. Values are shell-escaped for you — do NOT add quotes.
#     The same values are exported as $MB_CARD_ID, $MB_PR, $MB_SESSION, ...
#     Options per action: background: true (don't block; log to .mini-board/logs)
#     and capture_session: true (harvest the Claude session_id from the output).
#   accent: lane color shown on the web board (any CSS color).
#   Give actions a "name:" — it labels the lane's ⚡ ON ENTER chip, the
#   Automations page, and fired-automation toasts.
columns:
  - id: inbox
    title: Inbox
    accent: "#a8a29a"
    attention: true            # new asks always need triage

  - id: agent
    title: Agent Working
    accent: "#ea580c"
    stale_after: 4h            # agent quiet for 4h? probably stuck
    on_enter:
      # Fire an agent with the card's full context the moment you drag it here.
      - name: Dispatch agent
        run: claude -p {{prompt}} --output-format stream-json --verbose --permission-mode bypassPermissions
        background: true
        capture_session: true
    on_done: waiting-pr # when the agent run completes, funnel the card here
    max_visits: 2 # loop guard: 3rd entry parks the card in the paused lane
  - id: waiting-pr
    title: Waiting on PR
    accent: "#0d9488"
    stale_after: 24h           # PR sitting untouched for a day

  - id: follow-up
    title: Needs Follow-up
    accent: "#b91c1c"
    attention: true            # by definition: you owe it another round

  - id: review
    title: In Review
    accent: "#7c3aed"
    stale_after: 48h           # nudge reviewers after two days

  - id: merged
    title: Merged · Verify
    accent: "#1d4ed8"
    stale_after: 3d            # merged but unverified for 3 days
    # on_enter:
    #   - name: Verify release
    #     run: ./scripts/run-e2e.sh {{card.pr}}
    #     background: true

  - id: paused
    title: Paused
    attention: true # loop-guarded cards land here and need a human unblock

  - id: done
    title: Done
    accent: "#16a34a"

# Pipelines: a lane with `on_done: <lane>` funnels its cards onward when the
# lane's agent run completes (the target lane's automations fire — lanes
# chain). `max_visits` (per lane or the default here) is the loop guard: a
# card that would re-enter a lane too many times is parked in `paused`.
flow:
  paused: paused
  max_visits: 2

# `mb sync` pulls live PR state via the gh CLI and can move cards for you.
# While `mb web` runs, a watcher re-syncs on this interval and applies the
# auto_move rules — approved PRs surface for your attention on their own.
sync:
  every: 5m # 5m/30m/1h… or "off" to only sync manually
  auto_move:
    pr_merged: merged
    pr_closed: done
    pr_approved: follow-up # approved + ready → needs you
    # pr_changes_requested: follow-up
    # pr_checks_failing: agent  # failing CI → the agent lane fires remediation on_enter

# Triage — the board's intelligence layer (the Triage button / `mb triage`).
# An agent inspects cards in the lanes below, cross-references live state
# with its tools (does this ask already have a PR? is the ticket in review?),
# fills in missing refs, and moves each card to the lane it truly belongs in.
# Every move logs its reason on the card. Deterministic PR-state moves are
# handled by sync.auto_move above; triage covers what needs judgment.
triage:
  columns: [inbox] # lanes whose cards get triaged
  tools: [github, atlassian, slack]
  # instruction: extra guidance, e.g. "cards about infra go to the infra lane"

# Jira mirror — makes Jira the source of truth for lanes and tickets.
# THE mapping lives on the lanes: give a column `jira_status: "In Review"`
# and Jira sync (the Jira panel / `mb jira`) moves issues with that status
# into that lane, creating cards for issues the board hasn't seen. With
# push_moves, dragging a card into a mapped lane transitions the issue.
# jira:
#   project: NP
#   jql: assignee = currentUser() AND statusCategory != Done
#   push_moves: true        # dragging a card transitions the issue
#   lanes_from_jira: true   # workflow statuses become lanes automatically
#   config_issue: NP-1000   # lane config (on_enter/on_done/max_visits) parks
#                           # in this issue's description as a ```yaml lanes:``` block
#   comments: true          # agent run summaries land as issue comments
#   labels: true            # loop-guarded (paused) cards get the mb-paused label

# Card surface — what a card's details look like. Refs always link
# deterministically (PR URL, defaults.ticket_url + key, Slack permalink).
# "Refresh details" in the card drawer runs an agent that fetches live state
# for the refs and writes a summary, key facts, and links onto the card.
surface:
  tools: [github, atlassian, slack]
  # instruction: extra guidance, e.g. "always include the preview-env link"

# Named actions. These defaults are built in — override them here if you want
# different flags, a wrapper script, a different model, etc.
actions:
  # `mb comment <card> "..." --fire` → resumes the card's latest Claude session.
  fire_comment:
    run: claude --resume {{card.session}} -p {{message}} --output-format stream-json --verbose --permission-mode bypassPermissions
    background: true
    capture_session: true
  # `mb agent <card> ["instruction"]` → brand-new Claude session, full card context.
  new_agent:
    run: claude -p {{prompt}} --output-format stream-json --verbose --permission-mode bypassPermissions
    background: true
    capture_session: true
  # Ideas:
  # notify_slack:
  #   run: curl -s -X POST $SLACK_WEBHOOK -d "{\"text\": $MB_MESSAGE}"

# Sources — configurable prompts that scan the outside world through Claude
# + your connectors and come back as cards. Run with `mb pull [id]` or the
# Pull button on the web board. Each prompt is wrapped in a harness that
# shows Claude the current board (for dedupe) and demands typed JSON cards
# back, so re-runs don't duplicate.
#   tools: which connectors the prompt may use — slack / atlassian / gdrive /
#          github (the gh CLI) / web (search), or any raw --allowedTools
#          pattern like mcp__sentry.
#   column: where discovered cards land (default: first column).
sources:
  - id: slack-feedback
    title: Slack user feedback
    # Quote prompts containing "#" — YAML comments start at " #".
    prompt: "Look at the #user-feedback channel in Slack and find issues folks reported in the past 24 hours."
    tools: [slack]
    column: inbox
  - id: my-prs
    title: PRs waiting on me
    prompt: List open GitHub PRs that are assigned to me or where my review is requested.
    tools: [github]
    column: inbox
  - id: my-tickets
    title: Tickets on my plate
    prompt: List Jira tickets assigned to me that are not done, most urgent first.
    tools: [atlassian]
    column: inbox

# Connector tiles (`mb connect`, or the Sources panel on the web board) come
# with built-in setup commands for claude / slack / atlassian / gdrive.
# Override a tile here if you use a different MCP server, or add new ones —
# any extra key becomes its own tile.
# connectors:
#   slack:
#     setup: claude mcp add slack -s user -- npx -y some-other-slack-mcp
#   sentry:
#     title: Sentry MCP
#     setup: claude mcp add --transport http sentry https://mcp.sentry.dev/mcp -s user
